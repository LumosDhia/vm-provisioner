# Machine type definition for the vm-provisioner interactive menu.
# Keep this shell-sourceable: KEY="value", no spaces around =.

MACHINE_NAME="Ubuntu Server 26.04 LTS"
ISO_FILENAME="ubuntu-server.iso"
INSTALL_METHOD="cloud-init"   # Ubuntu Subiquity autoinstall (cloud-init YAML)

# Resource suggestions shown as defaults (user can override at runtime)
DEFAULT_INSTALL_VCPUS=4
DEFAULT_INSTALL_RAM_MB=6144
DEFAULT_FINAL_VCPUS=2
DEFAULT_FINAL_RAM_MB=2048
DEFAULT_DISK_GB=25

# How long to wait for SSH to come up after install before giving up.
SSH_WAIT_MINUTES=15

# GRUB patch: exact anchor line already present in this ISO's boot/grub/grub.cfg.
# The provisioner inserts a new autoinstall menuentry immediately above it.
GRUB_ANCHOR_LINE='menuentry "Try or Install Ubuntu Server" {'
AUTOINSTALL_ENTRY_TITLE="Autoinstall Ubuntu Server"
# NOTE: GRUB needs a backslash before the ';' (it's a command separator in
# grub.cfg). The provisioner adds that backslash itself at runtime (see
# build_autoinstall_iso in provision.sh) - awk/sed's own handling of a
# literal "\;" token is unreliable, so keep this value clean (no backslash).
AUTOINSTALL_KERNEL_ARGS="autoinstall ds=nocloud;s=/cdrom/nocloud/"
INSTALL_LINUX_PATH="/casper/vmlinuz"
INSTALL_INITRD_PATH="/casper/initrd"

# This ISO's El Torito UEFI boot image is "hidden" (embedded with no visible
# path in the ISO9660 tree), so the provisioner dd's it out by LBA/size.
EFI_IMAGE_HIDDEN="true"

# BIOS+UEFI hybrid built by grub-mkrescue (Ubuntu/Debian live installers).
ISO_BOOT_STYLE="grub2"
BIOS_BOOT_IMAGE_PATH="boot/grub/i386-pc/eltorito.img"
BOOT_CATALOG_PATH="boot.catalog"

# vmx guest settings
GUEST_OS="ubuntu-64"
FIRMWARE="efi"

# cloud-init template for this machine type (relative to this config dir)
USER_DATA_TEMPLATE="user-data.template.yaml"
META_DATA_TEMPLATE="meta-data.template"
