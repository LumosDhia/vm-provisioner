# Machine type definition for the vm-provisioner interactive menu.
# Keep this shell-sourceable: KEY="value", no spaces around =.

MACHINE_NAME="Kali Linux (XFCE) netinst"
ISO_FILENAME="kali-linux.iso"
INSTALL_METHOD="debian-preseed"   # Debian Installer preseed, via Kali's own simple-cdd layer

# Resource suggestions shown as defaults (user can override at runtime).
# Full XFCE desktop install, so heavier than the headless Ubuntu Server type.
DEFAULT_INSTALL_VCPUS=4
DEFAULT_INSTALL_RAM_MB=4096
DEFAULT_FINAL_VCPUS=2
DEFAULT_FINAL_RAM_MB=4096
DEFAULT_DISK_GB=40

# How long to wait for SSH to come up after install before giving up. Full
# XFCE desktop + full-upgrade can easily take 20-40+ min just for package
# retrieval, so this needs real headroom beyond the generic default.
SSH_WAIT_MINUTES=45

# GRUB patch: exact anchor line already present in this ISO's boot/grub/grub.cfg
# (the ISO's own top-level "Graphical install" entry). The provisioner inserts
# a new autoinstall menuentry immediately above it.
GRUB_ANCHOR_LINE="menuentry --hotkey=g 'Graphical install' {"
AUTOINSTALL_ENTRY_TITLE="Autoinstall Kali Linux"
# Kali ships its own preseed (simple-cdd/kali.preseed) covering apt/package
# policy, but it deliberately leaves out partitioning, user account, hostname
# and timezone. "custom" is our own profile (custom.preseed.template below),
# layered on top via simple-cdd's comma-separated profile list - this is the
# same mechanism Kali's own installer already uses, just with an extra
# profile appended, so kali.preseed itself is never touched.
#
# locale=/keymap= are passed directly on the kernel cmdline, not left to the
# preseed file: the language-selection question is asked before simple-cdd's
# own early_command even runs (that's what loads our custom.preseed), so
# setting debian-installer/locale *inside* custom.preseed is too late and
# the installer prompts anyway despite auto=true priority=critical. locale=
# and keymap= are Debian Installer's dedicated kernel-cmdline shortcuts for
# exactly this - parsed before any preseed file is read at all.
AUTOINSTALL_KERNEL_ARGS="net.ifnames=0 locale=en_US.UTF-8 keymap=us preseed/file=/cdrom/simple-cdd/default.preseed simple-cdd/profiles=kali,custom desktop=xfce auto=true priority=critical vga=788 quiet"
INSTALL_LINUX_PATH="/install.amd/vmlinuz"
INSTALL_INITRD_PATH="/install.amd/initrd.gz"

# This ISO's El Torito UEFI boot image is a real, visible file already (no
# need to dd it out of hidden El Torito catalog data like Ubuntu's ISO).
EFI_IMAGE_HIDDEN="false"
EFI_IMAGE_PATH="boot/grub/efi.img"

# BIOS+UEFI hybrid built the classic Debian-installer way: isolinux owns the
# BIOS boot path (not grub2, unlike Ubuntu's live-server ISO).
ISO_BOOT_STYLE="isolinux"
BIOS_BOOT_IMAGE_PATH="isolinux/isolinux.bin"
BOOT_CATALOG_PATH="isolinux/boot.cat"

# vmx guest settings (VMware has no Kali-specific guestOS id; Debian is the
# closest match since Kali is Debian-based)
GUEST_OS="debian12-64"
FIRMWARE="efi"

# preseed template for this machine type (relative to this config dir)
PRESEED_TEMPLATE="custom.preseed.template"

# Kali's own simple-cdd/kali.preseed disables the root account entirely
# (passwd/root-login boolean false) - this provisioner does not override
# that. The "root_ssh" toggle still adds your key to /root/.ssh and flips
# PermitRootLogin, but note root's password itself stays unset/locked -
# only key-based root SSH is expected to work here, not password root login.
